[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-first-agents"
version = "0.1.0"
description = "Deterministic readiness and boundary checks for AI-agent projects."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Ali Jabbary", email = "info@alijabbary.com" },
]
keywords = [
  "ai-agents",
  "agent-skills",
  "mcp",
  "readiness",
  "security",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
evidence-first-agents = "evidence_first_agents.cli:main"

[project.urls]
Homepage = "https://alijabbary.com"
Repository = "https://github.com/ali-kin4/evidence-first-agents"
Issues = "https://github.com/ali-kin4/evidence-first-agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_first_agents"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

